name: CI/CD - Microservicio Python

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: mi-microservicio
  REGISTRY: ghcr.io

jobs:
  # ────────────────────────────────
  # 1) LINT + FORMATO
  # ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Ejecutar ruff (lint)
        run: ruff check .

      - name: Ejecutar black (formato)
        run: black --check .

      - name: Chequeo de tipos con mypy
        run: mypy app/

  # ────────────────────────────────
  # 2) TESTS + COBERTURA
  # ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar tests con pytest
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────────────────────────
  # 3) ANÁLISIS DE SEGURIDAD
  # ────────────────────────────────
  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Escanear dependencias con pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Escanear código con bandit
        run: |
          pip install bandit
          bandit -r app/ -ll

  # ────────────────────────────────
  # 4) BUILD Y PUSH DE IMAGEN DOCKER
  # (solo en push a main/develop, no en PRs)
  # ────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login al registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tag de imagen
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────
  # 5) DEPLOY
  # develop -> staging (automático)
  # main -> producción (requiere aprobación manual vía "environment")
  # ────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Desplegar a staging
        run: |
          echo "Ejemplo: kubectl set image deployment/mi-microservicio \
            mi-microservicio=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --namespace=staging"

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production   # en GitHub, esto pide aprobación manual si se configura así
    steps:
      - name: Desplegar a producción
        run: |
          echo "Ejemplo: kubectl set image deployment/mi-microservicio \
            mi-microservicio=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --namespace=production"
